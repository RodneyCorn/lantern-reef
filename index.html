<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Reef</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #9bd8f5;
    font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif; user-select: none; }
  #game { display: block; width: 100vw; height: 100vh; outline: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff;
    text-shadow: 0 1px 0 rgba(0,0,0,.35), 0 0 8px rgba(0,60,120,.35); }
  .chip { position: absolute; padding: 6px 12px; border-radius: 14px;
    background: rgba(10, 40, 90, .38); font-size: 14px; letter-spacing: .02em; }
  #title { left: 16px; top: 14px; font-weight: bold; font-size: 16px; }
  #hint { left: 16px; bottom: 14px; opacity: .9; }
  #clock { right: 16px; top: 14px; font-variant-numeric: tabular-nums; }
  #fps { right: 16px; bottom: 14px; opacity: .7; font-size: 12px; }
  #zone { position: absolute; left: 50%; top: 18%; transform: translateX(-50%);
    text-align: center; opacity: 0; transition: opacity .6s ease; }
  #zone .name { font-size: 40px; font-weight: bold; letter-spacing: .04em;
    text-shadow: 0 2px 0 rgba(0,0,0,.35), 0 0 18px rgba(0,80,160,.5); }
  #zone .sub { font-size: 16px; font-style: italic; opacity: .95; margin-top: 4px; }
  #zone.show { opacity: 1; }
  #prompt { position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); font-size: 16px; opacity: 0; transition: opacity .2s; }
  #prompt.show { opacity: 1; }
  #bubble { position: absolute; transform: translate(-50%, -100%); max-width: 420px; min-width: 200px; background: #FFFDF6; color: #2A2A33;
    border-radius: 16px; padding: 12px 16px 14px; box-shadow: 0 6px 18px rgba(0,40,90,.25); font-size: 17px; line-height: 1.35;
    text-shadow: none; opacity: 0; transition: opacity .15s; pointer-events: none; }
  #bubble:after { content: ''; position: absolute; left: 50%; bottom: -12px; margin-left: -10px; border: 10px solid transparent; border-top-color: #FFFDF6; border-bottom: 0; }
  #bubble .who { font-weight: bold; color: #1A5CEC; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
  #bubble.show { opacity: 1; }
  #bubble .more { position: absolute; right: 12px; bottom: 6px; font-size: 11px; color: #8A8A99; opacity: 0; }
  #bubble.done .more { opacity: 1; }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="hud">
  <div id="title" class="chip">Lantern Reef <span style="opacity:.7;font-weight:normal">· milestone 4 life</span></div>
  <div id="clock" class="chip">10:00</div>
  <div id="hint" class="chip">WASD move · SPACE jump (twice for double) · E talk / sit · click + mouse to look · gamepad OK</div>
  <div id="fps" class="chip">-- fps</div>
  <div id="zone"><div class="name"></div><div class="sub"></div></div>
  <div id="prompt" class="chip"></div>
  <div id="bubble"><div class="who"></div><div class="text"></div><div class="more">E ▸</div></div>
</div>
